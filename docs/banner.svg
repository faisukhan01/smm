<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-label="SMM — AI Social Media Manager">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#0d9488" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#134e4a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#134e4a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1f2f38"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1016" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1016" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="#0a1016"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#glowTL)"/>
  <rect width="1280" height="400" fill="url(#glowBR)"/>
  <rect y="316" width="1280" height="84" fill="url(#fade)"/>

  <!-- top accent line -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#brand)" opacity="0.9"/>

  <!-- left: wordmark -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="72" y="64" width="150" height="30" rx="15" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-opacity="0.5"/>
    <text x="147" y="84" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#2dd4bf">OPEN SOURCE</text>

    <text x="66" y="188" font-size="112" font-weight="800" letter-spacing="4" fill="url(#wordmark)">SMM</text>

    <text x="72" y="238" font-size="27" font-weight="600" fill="#2dd4bf" letter-spacing="0.5">AI Social Media Manager</text>

    <text x="72" y="272" font-size="16.5" fill="#8fa3ad">Plan, create, publish and measure — across every platform,</text>
    <text x="72" y="296" font-size="16.5" fill="#8fa3ad">through official APIs only. No scraping. No fake numbers.</text>

    <!-- platform chips -->
    <g font-size="14" font-weight="600">
      <rect x="72" y="322" width="112" height="34" rx="17" fill="#101820" stroke="#24323d"/>
      <circle cx="92" cy="339" r="5" fill="#1877F2"/>
      <text x="106" y="344" fill="#c9d6dd">Facebook</text>

      <rect x="196" y="322" width="118" height="34" rx="17" fill="#101820" stroke="#24323d"/>
      <circle cx="216" cy="339" r="5" fill="#E1306C"/>
      <text x="230" y="344" fill="#c9d6dd">Instagram</text>

      <rect x="326" y="322" width="106" height="34" rx="17" fill="#101820" stroke="#24323d"/>
      <circle cx="346" cy="339" r="5" fill="#E60023"/>
      <text x="360" y="344" fill="#c9d6dd">Pinterest</text>
    </g>
  </g>

  <!-- right: product mock -->
  <g>
    <rect x="700" y="56" width="512" height="288" rx="18" fill="#0e151c" stroke="#1e2a33" stroke-width="1.5"/>
    <rect x="700" y="56" width="512" height="40" rx="18" fill="#101923"/>
    <circle cx="728" cy="76" r="5" fill="#e60023" opacity="0.85"/>
    <circle cx="748" cy="76" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="768" cy="76" r="5" fill="#10b981" opacity="0.85"/>
    <text x="920" y="81" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#5f7480" letter-spacing="1">smm · content calendar</text>
    <line x1="700" y1="96" x2="1212" y2="96" stroke="#1e2a33"/>

    <!-- row 1: AI caption -->
    <rect x="726" y="118" width="460" height="60" rx="12" fill="#121c26" stroke="#24323d"/>
    <circle cx="752" cy="148" r="12" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488"/>
    <path d="M752 141 l2.2 4.6 4.8.6 -3.5 3.4.9 4.9 -4.4-2.4 -4.4 2.4.9-4.9 -3.5-3.4 4.8-.6z" fill="#2dd4bf"/>
    <text x="776" y="141" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e8eef2">AI Caption · brand voice applied</text>
    <rect x="776" y="152" width="300" height="7" rx="3.5" fill="#1f2c36"/>
    <rect x="776" y="163" width="220" height="7" rx="3.5" fill="#1f2c36"/>

    <!-- row 2: publish pipeline -->
    <rect x="726" y="190" width="460" height="60" rx="12" fill="#121c26" stroke="#24323d"/>
    <text x="752" y="214" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e8eef2">Publishing engine</text>
    <text x="752" y="236" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f7480">idempotent · retried · timezone-correct</text>
    <rect x="940" y="216" width="120" height="8" rx="4" fill="#1f2c36"/>
    <rect x="940" y="216" width="92" height="8" rx="4" fill="url(#brand)"/>
    <text x="1072" y="225" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf">2 / 3 live</text>

    <!-- row 3: scheduled card -->
    <rect x="726" y="262" width="460" height="60" rx="12" fill="#121c26" stroke="#24323d"/>
    <rect x="744" y="278" width="86" height="26" rx="13" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-opacity="0.6"/>
    <text x="787" y="296" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2dd4bf" letter-spacing="1">APPROVED</text>
    <text x="846" y="296" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#a9bcc6">Scheduled today, 14:00 · GMT+5</text>
    <g>
      <circle cx="1094" cy="292" r="5" fill="#1877F2"/>
      <circle cx="1110" cy="292" r="5" fill="#E1306C"/>
      <circle cx="1126" cy="292" r="5" fill="#E60023"/>
    </g>

    <!-- floating badge -->
    <rect x="1064" y="30" width="176" height="40" rx="12" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488"/>
    <circle cx="1088" cy="50" r="6" fill="#2dd4bf"/>
    <text x="1104" y="55" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#99f6e4">Worker online</text>
  </g>

  <!-- bottom border -->
  <rect x="0" y="397" width="1280" height="3" fill="url(#brand)" opacity="0.9"/>
</svg>
